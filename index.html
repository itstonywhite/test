<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./public/styles/app.css" />
    <title>M1 Rocket Engine</title>
  </head>
  <body
    class="dark:bg-gray-900 flex flex-col h-screen w-screen justify-center overflow-hidden"
  >
    <svg class="hidden">
      <symbol id="moon" viewBox="0 0 24 24">
        <path
          fill="none"
          stroke="black"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
        />
      </symbol>
      <symbol id="sun" viewBox="0 0 24 24">
        <path
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
        />
      </symbol>
    </svg>
    <button
      id="toggleTheme"
      class="fixed left-4 top-4 shadow-md dark:bg-gray-700 dark:shadow-2xl cursor-pointer w-15 h-15 rounded-2xl flex items-center justify-center"
    >
      <svg class="size-6 text-white">
        <use href="#moon" id="theme-icon"></use>
      </svg>
    </button>
    <div class="container mx-auto w-full flex justify-center">
      <div
        class="main-box dark:bg-gray-800 dark:shadow-xl shadow-md border border-gray-300 dark:border-gray-600 max-w-sm rounded-xl overflow-hidden flex flex-col space-y-4"
      >
        <img
          src="./public/images/m1.png"
          class="box-img w-full object-cover select-none"
          alt="M-1 Engine"
        />
        <span
          class="title font-extrabold font-mono text-3xl pl-3 dark:text-gray-300"
          >M-1 Rocket Engine</span
        >
        <p
          class="px-3 select-none text-gray-600 text-lg text-justify dark:text-gray-300"
        >
          The Aerojet M-1 was one of the largest and most powerful
          liquid-hydrogen-fueled liquid-fuel rocket engines to be designed and
          component-tested.
        </p>
        <button
          type="button"
          class="text-white dark:text-gray-200 cursor-pointer select-none font-bolder w-max ml-3 mb-3 gap-2 flex bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base px-4 py-2.5 focus:outline-none"
        >
          Read more
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6 dark:stroke-gray-200"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"
            />
          </svg>
        </button>
      </div>
    </div>
    <script src="./public/js/app.js"></script>
  </body>
</html>
