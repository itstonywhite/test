<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/app.css" />
    <title>M1 Rocket Engine</title>
  </head>
  <body class="flex flex-col h-screen w-screen justify-center dark:bg-gray-900">
    <div class="container mx-auto w-full flex justify-center">
      <div
        class="main-box dark:bg-gray-800 dark:shadow-xl shadow-md border border-gray-300 dark:border-gray-600 max-w-sm rounded-xl overflow-hidden flex flex-col space-y-4"
      >
        <img
          src="./images/m1.png"
          class="box-img w-full object-cover select-none"
          alt="M-1 Engine"
        />
        <span
          class="title font-extrabold font-mono text-3xl pl-3 dark:text-gray-300"
          >M-1 Rocket Engine</span
        >
        <p
          class="px-3 select-none text-gray-600 text-lg text-justify dark:text-gray-300"
        >
          The Aerojet M-1 was one of the largest and most powerful
          liquid-hydrogen-fueled liquid-fuel rocket engines to be designed and
          component-tested.
        </p>
        <button
          type="button"
          class="text-white dark:text-gray-200 cursor-pointer select-none font-bolder w-max ml-3 mb-3 gap-2 flex bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base px-4 py-2.5 focus:outline-none"
        >
          Read more
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6 dark:stroke-gray-200"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"
            />
          </svg>
        </button>
      </div>
    </div>
  </body>
</html>
